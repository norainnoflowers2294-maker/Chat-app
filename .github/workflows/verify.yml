name: Verify ColorPop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check TypeScript
        run: npm run lint
      - name: Run Node tests
        run: node --test tests/*.test.mjs
      - name: Run Bun tests
        run: bun test src/utils/imageUrl.test.ts src/utils/pngParser.test.ts src/utils/promptAssembler.test.ts src/lib/__tests__/storage.test.ts
